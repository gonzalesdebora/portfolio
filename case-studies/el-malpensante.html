<!DOCTYPE html>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=VT323&family=Texturina:ital,opsz,wght@0,12..72,100..900;1,12..72,100..900&display=swap" rel="stylesheet">
</head>

<body>

        <section class="top-image">
            <figure>
                <img src="../img/el-malpensante/cover.png">
            </figure>
        </section>

        <section class="container">
            <div class="content">
                <div class="text">
                    <div class="empty"></div><div class="title">
                        <div class="title-content">
                            <h2>El Malpensante</h2>
                        </div>
                    </div>
                    <div class="description">
                        <div class="description-content">
                            <h1>El Malpensante case study coming soon.</h1>

                        </div>
                    </div>
                </div>
            </div>

        <nav>
            <button class="menu-toggle" type="button">MENU</button>
        </nav>

    <div id="fullscreen-menu" class="fullscreen-menu">
        <div class="menu-content">
            <a href="../index.html">Work</a>
            <a href="../approach.html">Approach</a>
            <a href="../resume.html">Resume</a>
        </div>
        <button id="close-menu" class="close-menu" type="button">Close</button>
    </div>

    <script>
        let toggleButton = document.querySelector('.menu-toggle');
        let menu = document.getElementById('fullscreen-menu');
        let closeButton = document.getElementById('close-menu');

        function openMenu() {
            menu.style.visibility = 'visible';
            menu.style.opacity = '1';
        }

        function closeMenu() {
            menu.style.visibility = 'hidden';
            menu.style.opacity = '0';
        }

        toggleButton.addEventListener('click', openMenu);
        closeButton.addEventListener('click', closeMenu);

    </script>

</body>
